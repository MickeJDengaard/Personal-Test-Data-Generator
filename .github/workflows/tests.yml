name: tests.yml
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests
        run: mvn -B test

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run integration tests
        run: mvn -B verify

  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Start app and database
        run: docker compose up -d --build

      - name: Wait for API
        run: |
          timeout 120 sh -c 'until curl -s -o /dev/null http://localhost:8080/phone; do sleep 2; done' || {
            docker compose ps -a
            docker compose logs
            exit 1
          }

      - name: Install Postman CLI
        run: curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Login to Postman CLI
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: postman login --with-api-key "$POSTMAN_API_KEY"

      - name: Run API tests
        run: |
          postman collection run "58427717-df35cbaf-96be-4dd4-9185-62e756b846b4" \
            -e "58427717-aed7b47b-0131-4d4d-b34a-fecd735fe093" \
            --env-var "BASE_URL=http://localhost:8080"

      - name: Stop stack
        if: always()
        run: docker compose down -v
  e2e-tests:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - uses: actions/checkout@v7

      - name: Checkout frontend
        uses: actions/checkout@v7
        with:
          repository: MickeJDengaard/Personal-Test-Data-Generator-Frontend
          path: frontend

      - name: Start app and database
        run: docker compose up -d --build

      - name: Wait for API
        run: |
          timeout 120 sh -c 'until curl -s -o /dev/null http://localhost:8080/phone; do sleep 2; done' || {
            docker compose ps -a
            docker compose logs
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Playwright tests
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
          npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report

      - name: Stop stack
        if: always()
        run: docker compose down -v
